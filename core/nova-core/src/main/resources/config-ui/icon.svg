<!--
  NovaBot 图标
  本项目原创，非衍生自上游 StarBot 的任何图形资产。
  设计意图：消息气泡承载「推送」，内部的新星闪光承载「Nova」，两者叠起来即项目所做的事。
  纯几何构造，不含任何字体轮廓，因此可自由缩放，也没有字体授权问题。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NovaBot">
  <defs>
    <linearGradient id="novaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF5F9E"/>
    </linearGradient>
  </defs>

  <!-- 消息气泡：四角大圆角，左下角引出尾巴 -->
  <path fill="url(#novaGrad)"
        d="M16 4h32a12 12 0 0 1 12 12v18a12 12 0 0 1-12 12H32L20.4 55.4a1.5 1.5 0 0 1-2.4-1.5L20.6 46H16A12 12 0 0 1 4 34V16A12 12 0 0 1 16 4Z"/>

  <!-- 主星：四角星，四边内凹以获得「爆发」的锐利感 -->
  <path fill="#fff"
        d="M28 11C28 20.8 31.6 25 40 25 31.6 25 28 29.2 28 39 28 29.2 24.4 25 16 25 24.4 25 28 20.8 28 11Z"/>

  <!-- 副星：只用来打破对称，尺寸不到主星三分之一，小图标下自然消隐也不影响识别 -->
  <path fill="#fff" fill-opacity=".85"
        d="M45 29.5C45 34.05 46.5 36 50 36 46.5 36 45 37.95 45 42.5 45 37.95 43.5 36 40 36 43.5 36 45 34.05 45 29.5Z"/>
</svg>
