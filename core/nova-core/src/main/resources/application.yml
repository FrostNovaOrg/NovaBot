# 打进程序里的默认配置。
#
# 🔴 这一份不是给使用者改的 —— 它在 jar 里面。使用者的配置是程序目录下的 application.yml，
#    那份在第一次保存设置时由程序自己写出来（键与说明取自配置面），此后归使用者所有。
#
# 只放「不写在这里，程序就跑不成一个像样的默认形态」的那几项。其余一律靠 Java 侧的字段默认值：
# 同一个默认值写两处，改一处忘一处的表现是「代码里写着 A，跑起来是 B」，而两边看着都对。
spring:
  # 数据源实现按 profile 选取，json 对应读 datasource.json 的那一个。
  #
  # 🔴 这一行必须在这里，不能只写在使用者那份配置里：免配置起步的实例第一次跑起来时
  #    那份文件还不存在，选不到任何实现就会回落到空数据源 —— 程序照常启动、控制台照常打开、
  #    主播也加得进去，只是<b>一条推送都不会发</b>，而界面上看不出任何异常。
  #    第三方插件自带数据源时，在使用者那份配置里把这一行改成对应的 profile 名即可覆盖。
  profiles:
    active: json

server:
  # 监听地址。
  #
  # 🔴 这一行必须在这里，不能只写在使用者那份配置里：免配置起步的实例第一次跑起来时
  #    那份文件还不存在，address 为空就会监听所有网卡 —— 推送接口等 /config 以外的接口
  #    对外网卡全开着，而文档处处写着「默认只听本机」。设置页上那个 127.0.0.1 只是
  #    显示用的默认值，不参与绑定，顶不了这一行。
  #    要从别的机器连，在使用者那份配置里改成 0.0.0.0（这会把推送接口暴露到网络）；
  #    容器镜像另用 SERVER_ADDRESS 覆盖成 0.0.0.0 —— 容器里只听回环等于谁也连不上，
  #    对外开不开由 docker run 的 -p 决定。
  address: 127.0.0.1
  port: 7827

novabot:
  core:
    log:
      console: INFO
      file: INFO
