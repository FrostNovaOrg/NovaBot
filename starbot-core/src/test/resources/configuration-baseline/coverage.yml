# 绑定结果这一格的输入：每一个配置键都写上一个与默认值不同的值。
#
# 用不同的值是有意的：写成默认值的键，绑没绑上看起来一模一样。
# 这里的值只在测试里用，与发行模板 dist/templates/application.example.yml 无关。
starbot:
  core:
    network-thread:
      core-pool-size: 3
      max-pool-size: 33
      queue-capacity: 333
      keep-alive-seconds: 3333
    log:
      console: WARN
      file: TRACE
      event-log: true
      network-log: true
      network-log-suppress-window: 11
    network:
      connect-timeout: 21
      read-timeout: 22
    datasource:
      json-path: coverage-datasource.json
      json-auto-reload: false
    plugin:
      auto-download-dependency: false
      maven-base-urls:
        - https://example.invalid/one
        - https://example.invalid/two
    live:
      save-live-data: false
      live-data-path: coverage-data.json
      auto-save-live-data-interval: 41
      reconnect-interval: 42
      detail-retention-days: 43
    paint:
      fonts:
        - CoverageFontA
        - CoverageFontB
      auto-expand-height: 51
      extra-copyrights:
        - text: coverage-copyright
          size: 52
          style: 1
    mail:
      default-to: coverage@example.invalid
    config-ui:
      enabled: false
      backup-keep: 12
      token: coverage-console-token
      allow-ips:
        - 10.0.0.0/8
      auth:
        password: coverage-password
        totp: false
        totp-secret: COVERAGESECRET
        operator-token: false
        session-hours: 61
        idle-hours: 62
        max-failures: 63
        lockout-minutes: 64
      agreement:
        accepted-version: 71
        accepted-at: "2026-01-02T03:04:05"
        accepted-by: password
      update:
        enabled: false
        source: http://127.0.0.1:1/coverage-release
    alert:
      enabled: false
      convergence-interval: 81
      webhook-url: http://127.0.0.1:18080/hook
      webhook-method: GET
      webhook-title-field: coverage-title
      webhook-content-field: coverage-content
      webhook-headers:
        Authorization: Bearer coverage
        X-Coverage: "coverage-header"
      retry-interval: 83
      retry-queue-size: 84
      retry-max-attempts: 85
    push:
      enabled: false
      first-push-tip: false
      at-all-daily-limit: 91
      at-all-session-daily-limit: 92
      quiet-start: "23:30"
      quiet-end: "07:45"
    command:
      admins:
        - 101
        - 102
    timeline:
      retention-days: 107
    exec:
      enabled: true
      timeout: 111
      max-concurrent: 112
      rules:
        - enabled: false
          event: LiveOnEvent
          command:
            - /bin/echo
            - "{event}"
    sender:
      - name: coverage-sender
        url: http://127.0.0.1:19/send
        token: coverage-sender-token
        delay: 121
    event-stream:
      enabled: true
      path: /coverage/events
      require-token: true
      buffer-size: 131
