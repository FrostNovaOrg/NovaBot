<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NovaBot 控制台</title>
  <style>
    * { box-sizing: border-box }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f6f7f9; color: #333;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    form, section {
      width: 320px; max-width: calc(100vw - 32px); padding: 32px 28px;
      background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0, 0, 0, .06);
    }
    /* 协议卡片比口令表单宽：条款按 320px 折行，一条要折成四五行，没人读得下去 */
    section { width: 520px }
    h1 { margin: 0 0 4px; font-size: 20px }
    p.sub { margin: 0 0 24px; font-size: 13px; color: #999 }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #666 }
    input {
      width: 100%; padding: 9px 12px; margin-bottom: 16px; font-size: 14px;
      border: 1px solid #dcdfe6; border-radius: 6px; background: #fff; color: #333;
    }
    input:focus { outline: none; border-color: #fb7299 }
    button {
      width: 100%; padding: 10px; font-size: 14px; color: #fff; cursor: pointer;
      background: #fb7299; border: none; border-radius: 6px;
    }
    button:disabled { background: #fbb0c4; cursor: default }
    .msg { margin-top: 14px; font-size: 13px; color: #f56c6c; min-height: 18px; text-align: center }
    .hidden { display: none }
    /* 通行密钥与口令是并列的两条路，中间给一条分隔 */
    #passkey { margin-bottom: 14px }
    p.or { margin: 0 0 18px; font-size: 12px; color: #aaa; text-align: center }
    /* 正文照原样显示：换行与空行是文案的一部分，挤成一坨就没人读了。
       长文案给一个滚动区，按钮始终留在卡片里看得见的位置 */
    #agreement-text {
      margin: 4px 0 20px; padding: 14px 16px; max-height: 46vh; overflow-y: auto;
      white-space: pre-wrap; font-size: 13px; line-height: 1.8; color: #555;
      background: #fafbfc; border: 1px solid #ebeef5; border-radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1c1f; color: #e5e6eb }
      form, section { background: #26272b; box-shadow: none }
      label { color: #909399 }
      input { background: #1b1c1f; border-color: #3c3d41; color: #e5e6eb }
      #agreement-text { background: #1b1c1f; border-color: #3c3d41; color: #c9cbd1 }
    }
  </style>
</head>
<body>
<section id="agreement" class="hidden">
  <h1>NovaBot 使用协议</h1>
  <p class="sub">进入控制台之前，请先读一遍下面的约定</p>

  <!-- 正文由 /api/auth/agreement 下发后填入，页面里不留第二份副本 -->
  <div id="agreement-text"></div>

  <button type="button" id="accept">同意并继续</button>
  <div class="msg" id="agreement-msg"></div>
</section>

<form id="form" class="hidden" autocomplete="on">
  <h1>NovaBot 控制台</h1>
  <p class="sub">请输入口令后继续</p>

  <!--
    单用户面板本来没有「账号」这一说，但密码管理器需要一个用户名字段才肯保存条目。
    这里放一个固定值的隐藏字段，仅用于让浏览器把口令记在一条可识别的记录上。
  -->
  <input type="text" name="username" value="novabot" autocomplete="username" class="hidden" readonly>

  <!--
    通行密钥这条路。默认藏着，由脚本问过服务端「这台机器登记过没有」之后才摆出来——
    一个点了必然失败的按钮，比没有这个按钮更让人不知所措。
    版式（谁主谁次）与「登录与安全」那一组一并重排，此处只把线接上。
  -->
  <div id="passkey-field" class="hidden">
    <button type="button" id="passkey">用通行密钥登录</button>
    <p class="or">或者输入口令</p>
  </div>

  <label for="password">口令</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>

  <div id="code-field" class="hidden">
    <label for="code">动态验证码</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]*" maxlength="6" placeholder="验证器应用中的 6 位数字">
  </div>

  <button type="submit" id="submit">登录</button>
  <div class="msg" id="msg"></div>
</form>

<script>
  const $ = s => document.querySelector(s);
  const show = s => $(s).classList.remove('hidden');
  const hide = s => $(s).classList.add('hidden');

  // 点同意那一趟要带上它。CSRF 令牌只发给已经持有会话的人，
  // 未配口令的那一形态里没有会话，也就没有这个值——那一形态靠的是令牌 Cookie 与 SameSite
  let csrfToken = null;

  // 凭据里的二进制在浏览器那一侧是 ArrayBuffer，接口两侧一律用 base64url。
  // 这张页面不取任何外部资源（未登录时由服务端直接吐出来），因此这两行与设置页里那一份
  // 是各自一份而不是共用——共用就意味着这张页面要在还没登录的时候先去要一个脚本文件
  const toBuffer = v => Uint8Array.from(atob(v.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const toBase64Url = b => btoa(String.fromCharCode(...new Uint8Array(b)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  function showLogin(state) {
    if (state.totpRequired) show('#code-field');
    show('#form');
    $('#password').focus();
    offerPasskey();
  }

  /**
   * 这台机器登记过通行密钥吗？登记过才摆出那个按钮
   *
   * 接口只在安全上下文（https 或 localhost）里存在，内网 http 访问时它直接是 undefined——
   * 不判这一句的话，点下去只会抛一个使用者看不懂的异常
   */
  function offerPasskey() {
    if (typeof window.PublicKeyCredential !== 'function') return;

    fetch('/config/api/auth/passkey/login/options', {method: 'POST'})
      .then(r => r.json())
      .then(options => { if (options.success) show('#passkey-field'); })
      .catch(() => {});
  }

  async function loginWithPasskey() {
    $('#passkey').disabled = true;
    $('#msg').textContent = '';

    try {
      // 这一趟要的是一个新挑战：上面那一趟只用来判断「要不要摆这个按钮」，
      // 它发出去的那个挑战早已作废（挑战是一次性的）
      const options = await fetch('/config/api/auth/passkey/login/options', {method: 'POST'}).then(r => r.json());
      if (!options.success) {
        $('#msg').textContent = options.message || '这台机器还没有登记过通行密钥';
        return;
      }

      const credential = await navigator.credentials.get({
        publicKey: {
          challenge: toBuffer(options.challenge),
          rpId: options.rpId,
          timeout: options.timeout,
          userVerification: options.userVerification,
          allowCredentials: (options.allowCredentials || []).map(c => ({type: 'public-key', id: toBuffer(c.id)})),
        },
      });

      const r = await fetch('/config/api/auth/passkey/login/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          id: credential.id,
          response: {
            clientDataJSON: toBase64Url(credential.response.clientDataJSON),
            authenticatorData: toBase64Url(credential.response.authenticatorData),
            signature: toBase64Url(credential.response.signature),
          },
        }),
      });
      const data = await r.json();

      if (data.success) {
        // 与口令登录同法走整页跳转。协议若还没同意，/config 会把这张页面再发回来一次
        location.replace('/config');
        return;
      }

      $('#msg').textContent = data.message || '这把通行密钥没能通过验证';
    } catch (err) {
      // 使用者按了取消也会走到这里。不说成「出错了」——那会让人以为设备有问题
      $('#msg').textContent = err.name === 'NotAllowedError' ? '' : '无法使用通行密钥：' + err.message;
    } finally {
      $('#passkey').disabled = false;
    }
  }

  function showAgreement() {
    show('#agreement');

    // 文案只有服务端那一份。在这里再抄一遍的话，改了文件而没改页面，
    // 使用者同意的与文件里写的就不是同一份东西了，而且从界面上完全看不出来
    fetch('/config/api/auth/agreement')
      .then(r => r.json())
      .then(data => {
        // textContent 而非 innerHTML：文案是文字，不该被当成标记解释
        $('#agreement-text').textContent = data.text || '';
        if (!data.success) $('#agreement-msg').textContent = data.message || '使用协议读取失败';
      })
      .catch(() => {
        $('#agreement-msg').textContent = '无法连接到服务器';
      });
  }

  function apply(state) {
    csrfToken = state.csrfToken || null;

    // 认出来是谁了没有。未配口令的那一形态里没有会话可言，
    // 但这张页面在那一形态下只会由验过令牌的请求取到，取到它本身就说明人已经进了门
    const known = state.authenticated || !state.enabled;

    if (!known) {
      showLogin(state);
      return;
    }

    // 先登录、后同意：协议面板只在人已经被认出来之后才摆出来，
    // 这样点下「同意并继续」的必定是刚刚通过口令或启动令牌的那一位
    if (state.agreementRequired) {
      showAgreement();
      return;
    }

    // 已经登录、协议也过了却停在登录页，多半是点了后退，直接回控制台
    location.replace('/config');
  }

  fetch('/config/api/auth/state')
    .then(r => r.json())
    .then(apply)
    // 状态问不到时把口令表单摆出来：这样人至少看得见「无法连接到服务器」，
    // 而不是对着一张什么都没有的白页
    .catch(() => show('#form'));

  $('#passkey').addEventListener('click', loginWithPasskey);

  $('#accept').addEventListener('click', async () => {
    $('#accept').disabled = true;
    $('#agreement-msg').textContent = '';

    try {
      const r = await fetch('/config/api/auth/agreement/accept', {
        method: 'POST',
        headers: csrfToken ? {'X-CSRF-Token': csrfToken} : {}
      });
      const state = await r.json();

      if (!r.ok || state.agreementRequired) {
        $('#agreement-msg').textContent = state.message || '使用协议未能记录，请重试';
        return;
      }

      // 同意之前就已经登录过了，这一步之后控制台就开着
      hide('#agreement');
      location.replace('/config');
    } catch (err) {
      $('#agreement-msg').textContent = '无法连接到服务器';
    } finally {
      $('#accept').disabled = false;
    }
  });

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    $('#submit').disabled = true;
    $('#msg').textContent = '';

    try {
      const r = await fetch('/config/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: $('#password').value, code: $('#code').value})
      });
      const data = await r.json();

      if (data.success) {
        // 交给浏览器保存口令：submit 事件里改用整页跳转，密码管理器才会认为这是一次成功登录。
        // 协议若还没同意，/config 会把这张页面再发回来一次，那一次摆出来的就是协议面板
        location.replace('/config');
        return;
      }

      $('#msg').textContent = data.message || '登录失败';
      $('#password').value = '';
      $('#password').focus();
    } catch (err) {
      $('#msg').textContent = '无法连接到服务器';
    } finally {
      $('#submit').disabled = false;
    }
  });
</script>
</body>
</html>
