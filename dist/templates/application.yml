server:
  port: 7827                # StarBot 服务端口
  tomcat:
    threads:
      max: 8                # 工作线程上限。StarBot 只服务推送接口与配置界面，
      min-spare: 2          # 默认的 200 线程纯属浪费，8 个足以应付
    max-connections: 64
    accept-count: 32
  address: 127.0.0.1        # 监听地址。默认仅监听回环，改为 0.0.0.0 会使推送接口暴露到网络，
                            # 务必先阅读 SECURITY.md 并配置 api-token 与 allow-ips

spring:
  profiles:
    active: json            # 数据源类型。目前只有 json（读取 datasource.json）一种，
                            # 第三方插件可自带数据源实现并在此指定对应的 profile 名
  mail:                     # 邮件告警的发件服务。不用邮件告警时整段留空即可
    host:                   # SMTP 服务器地址，如 smtp.qq.com
    port:                   # SMTP 端口，如 465（SSL）或 587（STARTTLS）
    username:               # 发件账号
    password:               # 发件账号的授权码（多数邮箱服务需在网页端单独申请，不是登录密码）
    # 收件地址填在下方的 starbot.core.alert.mail.default-to，四项发件配置与收件地址缺一不可
  # 累计数据存储（可选）。不配则只有本场数据，「我的总数据」「直播间总数据」
  # 「总数据排行榜」会明确提示不可用。要启用就去掉下面四行的注释并填上地址，
  # 或直接在配置界面的「累计数据存储（Redis）」分组里填。
  #
  # 【务必保持注释而不是留空】写成「host:」这样的空值会让 Spring 在启动时
  # 直接抛 'host' must not be empty，程序根本起不来——这个坑踩过。
  # data:
  #   redis:
  #     host: 127.0.0.1     # 只需本机可达，切勿暴露到公网
  #     port: 6379
  #     password:           # 未设密码时可省略此行
  #     database: 0         # 与其他程序共用同一实例时可换一个库避免键冲突

starbot:
  adapter:
    onebot:
      security:
        enabled: true                 # 推送接口安全校验总开关，仅在完全可信的隔离网络中才建议关闭
        allow-ips:                    # 允许调用推送接口的来源，支持 CIDR
          - 127.0.0.1/32
          - ::1/128
        trust-proxy: false            # 仅当确实部署在反向代理之后时才可开启，否则来源 IP 可被伪造
        audit-log: true               # 是否输出鉴权失败的审计日志
        fail-on-weak-config: false    # 弱 Token 时是否直接终止启动，外网可达的部署建议设为 true
        rate-limit:
          enabled: true
          permits-per-minute: 600     # 单个来源每分钟允许的请求数
          burst: 100                  # 可容忍的瞬时突发请求数

      senders:
        - name: qq-onebot                   # 推送平台名称，需唯一，与 datasource.json 中的 platform 对应
          api: /send                        # 推送接口路径，需唯一
          api-token:                        # 推送接口访问 Token。留空则启动时自动生成随机 Token，
                                            # 本机部署无需配置；需外部程序调用时在此填入随机串
          websocket: true                   # 是否启用 Websocket
          one-bot-address: 127.0.0.1        # OneBot 实现的地址
          one-bot-http-port: 3000           # OneBot HTTP 端口
          one-bot-websocket-port: 3001      # OneBot Websocket 端口
          one-bot-http-token:               # OneBot HTTP Token，必填，与 OneBot 实现中配置的一致
          one-bot-websocket-token:          # OneBot Websocket Token，必填
          delay: 1000                       # 消息发送间隔，单位：毫秒
          debug-log-max-length: 0           # 原始日志输出长度限制，0 为不限制

      detect:
        enable-http-detect: true            # 是否定期检测 OneBot HTTP 可用性。关闭后 OneBot
                                            # 中途挂掉不会被察觉，表现为「消息发不出去且无人告知」
        http-detect-interval: 300           # HTTP 检测周期，单位：秒
        slow-threshold-millis: 2000         # 接口调用耗时超过多少判定为「慢」，单位：毫秒。
                                            # 只判「通不通」会漏掉一整类故障：接口一直返回 200、
                                            # 账号一直在线，但每次调用要好几秒，此时带图的推送
                                            # 已经在丢——图片是几百 KB 的内联 base64，转发一慢
                                            # 就没有工作线程去读它，最终卡满超时被丢弃。
                                            # 判据取最近若干次的中位数，健康时的偶发慢调用
                                            # 不会翻黄。0 为关闭这项判定
        enable-websocket-detect: true       # 是否检测 Websocket 是否仍在收心跳。长连接可能
                                            # 在 TCP 层看似存活却已收不到任何数据
        websocket-silence-timeout: 120      # 多久没收到心跳即判定连接失效，单位：秒。判据是
                                            # OneBot 实现推送的心跳，与群里有没有人说话无关；
                                            # 实际超时不会小于三个心跳周期，配短了也不会误报

      extension:
        napcat:
          enable-backup-at-all: true        # @全体成员 次数不足时是否改用群待办

  bilibili:
    account:
      anonymous: false              # 是否匿名（免登录）运行。开启后完全不使用凭据：不读已保存的凭据、
                                    # 不弹二维码、不做复检与续期。直播采集照常，动态推送与自动关注不可用。
                                    # ⚠️ 匿名连接拿到的数据是不完整的，这是实测结论：部分房间的弹幕会被
                                    # 服务端限制下发（同房同时段实测到达率低至 4.3%），拿得到的弹幕里
                                    # 发送者 uid 一律被抹成 0、昵称只留首字（形如 b***）。
                                    # 它不是「功能一致的免登录版」，要完整数据就得登录
      cookie-path: cookies.json     # 登录凭据存储路径
      encrypt: true                 # 是否加密存储登录凭据。凭据等同于账号密码，强烈建议保持开启
      key-path: cookies.key         # 加密密钥存储路径
      verify-interval: 600          # 登录态复检间隔，单位：秒，设为 0 关闭。
                                    # 凭据失效后动态推送会静默停摆，复检可将其转为显式告警
      auto-refresh-cookie: true     # 是否自动续期登录凭据。哔哩哔哩会随接口调用逐步作废 Web 端凭据，
                                    # 关闭后凭据会某天突然失效、只能重新扫码
      maintenance-backoff-cap: 3600 # 凭据维护失败后的退避上限，单位：秒。
                                    # 复检与续期各自独立退避：一件连续失败就逐级拉长自己的间隔
                                    # （一倍、两倍、四倍……），成功即回到复检间隔，两者互不影响。
                                    # 上限的意义是别把间隔拉到几天——退避是为了不在故障期间空转，不是放弃

    debug:
      live-room-raw-message-log: false    # 直播间原始消息调试日志，会输出大量内容且可能含用户信息
      dynamic-raw-message-log: false      # 动态接口原始响应调试日志

    network:
      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
      api-retry-max-times: 3        # 接口失败重试次数
      api-retry-interval: 3000      # 重试间隔，单位：毫秒

    live:
      enable-connect-live-room: true      # 是否连接直播间长连接。被风控时可关闭，仅用备用直播推送
      only-connect-necessary-rooms: false # 是否仅连接订阅了直播事件的直播间。
                                          # 默认 false，即配置里启用的主播全都连——「纯监听房间」
                                          #（配了主播但不配任何推送目标，只采集不推送）是正式能力。
                                          # ⚠️ 改成 true 会把纯监听房间整个跳过，表现是「加了主播却
                                          # 什么都没发生」（跳过时日志里会逐个列出来）。它是大规模
                                          # 部署下减少连接数的优化项，只在连接数受限、又确实只关心推送时才开
      live-room-connect-interval: 2000    # 直播间连接间隔，过快会触发风控，单位：毫秒
      live-room-reconnect-interval: 1000  # 重连基准间隔，实际间隔按失败次数指数退避
      # 断线摘要：逐次一行「连接已断开」在断线风暴里恰好最没用——十个房间各断五次就是五十行，
      # 数不清次数，也看不出是集中在一个房间还是所有房间一起断，而这两者的处理方式相反。
      # 逐次那行走 DEBUG，按窗口汇总成一条带归因（握手期被切断 / 网络抖动 / 认证后很快被切断…）
      # 与处理建议的摘要。没有断线的窗口不打日志
      disconnect-digest-interval: 600     # 汇总窗口，单位：秒，设为 0 关闭
      # 解码限额：防御异常或恶意构造的数据包，不是预期值——正常包解压后只有几十 KB。
      # 做成可配是为了小内存机器：默认堆 -Xmx512m，而 32 MB 上限允许单次解压吃掉
      # 32 MB 连续字节数组，那时防御上限自己就可能是压垮内存的那根稻草。
      # 1 GB 机器建议连同 -Xmx 一起调低，见 docs/performance.md。非正数回退到默认值
      max-decompressed-bytes: 33554432    # 解压后最大字节数，默认 32 MB
      max-decode-nesting-depth: 3         # 压缩包最大嵌套层数，正常数据不超过一层
      gift-cache-expire: 3600             # 礼物配置缓存时长，单位：秒
      complete-event: false               # 是否请求接口补全事件中缺失的昵称、头像等信息
      auto-detect-live-room-risk: true    # 是否检测直播间数据风控
      auto-detect-live-room-risk-interval: 60   # 风控检测周期，单位：秒
      auto-detect-live-room-risk-windows: 3     # 连续多少个检测窗口业务消息为零才判定为疑似断流。
                                                # 与上面的间隔相乘即持续时长，默认 3 × 60 秒 = 3 分钟。
                                                # 判据是业务消息（弹幕/礼物/上舰/醒目留言）断流，
                                                # 不是进房消息占比——热门房间进房天然刷屏，按占比判会误报
      backup-live-push: true              # 是否启用备用直播推送（轮询接口兜底开播下播）
      backup-live-push-interval: 10       # 备用推送检测间隔，单位：秒
      snapshot-interval: 6                # 主播基础数据（粉丝数、粉丝团、大航海）的留档间隔，单位：小时，0 为关闭。
                                          # 本场数据只覆盖直播期间，而这些数字在不播的日子里照样在变；
                                          # 没有这份留档，「本周涨了多少粉」只能答成「每场开播时分别是多少」

    dynamic:
      auto-follow: true             # 是否用登录账号自动关注「被监听的 UP 主」（不是回关粉丝）。
                                    # 动态流接口只返回已关注账号的动态，关掉就需自行手动关注，
                                    # 否则收不到动态。该开关会修改登录账号的关注列表
      auto-follow-interval: 30      # 自动关注检查间隔，单位：秒
      api-request-interval: 10      # 动态接口请求间隔，单位：秒
      logo-path:                    # 动态图片底部标识的图片路径，留空则不绘制。
                                    # 本项目不内置标识图片，需要打自己社群的标时填入本地图片路径
      auto-save-image: false        # 是否把绘制出的动态图片保存到本地
      push-minutes: 1440            # 发布时间早于此分钟数的动态不再推送，避免启动时补推历史动态
      push-live-dynamic: false      # 是否推送开播动态（B站在开播时自动发的那条）。默认关闭：
                                    # 它和开播推送是同一件事的两条通道，开了同一个群会收到两遍，
                                    # 而且这条迟到约半小时、没有标题封面、不能 at 全体成员。
                                    # 打开前先确认该 UP 主配了开播推送，否则关掉就收不到开播消息了

    event-stream:                   # 事件输出。把直播间事件按事件输出协议 v2 实时推给本机的其他程序，
                                    # 用于自建面板一类的场景。它只输出，不接受任何指令
      enabled: false                # ⚠️ 默认关闭。用不到的部署不该凭空多一个监听端点。
                                    # 打开后地址为 ws://127.0.0.1:<server.port><path>
      path: /nova/events            # 事件输出的路径，与配置界面共用 server.port 端口。
                                    # ⚠️ 只接受来自本机回环地址的连接，且这一点与上面的 server.address 无关——
                                    # 即使为了对外提供推送接口把监听地址改成了 0.0.0.0，事件流也只认本机。
                                    # 需要从其他机器读取请自行建立 SSH 隧道，直接暴露到公网风险自负：
                                    # 事件流里有观众的昵称、uid 与消费金额
      require-token: false          # 🔴 装了反向代理就必须改成 true，这不是可选项。
                                    # 反代与本程序在同一台机器上，**且反代没把 X-Forwarded-* 送下来时**，
                                    # 它转发过来的连接源地址就是回环——
                                    # 也就是说反代一上线，上面那条「只认本机」就不再等于「人在这台机器上」，
                                    # 任何能连上反代的人在端点看来都是本机。开着它才有真正的门。
                                    # ⚠️ 不打开时表面一切正常、门却是敞开的，所以启动会打一条 WARN 提醒。
                                    # 口令在配置控制台签发（只读：既不给 shell 也不给控制台），
                                    # 明文只在签发那一刻显示一次，关掉就取不回。
                                    # 面板用它连接时放在 Sec-WebSocket-Protocol 子协议里，
                                    # 形如 nova.token.<口令>；本端刻意不接受 ?token= 查询参数。
      buffer-size: 2000             # 断线回补的缓冲条数，全部房间共用一条流。
                                    # 三个房间每分钟各 100 条时约覆盖 6 分钟；房间更多或更热闹就要调大，
                                    # 否则客户端重连时会被告知补不上而重置。每条约数 KB，调大前先掂量内存

  core:
    log:
      console:                      # 控制台日志级别，留空用内置默认。可填 TRACE/DEBUG/INFO/WARN/ERROR/OFF
      file:                         # 日志文件级别，同上。
                                    # 排查直播间消息时可把 console 调到 DEBUG，
                                    # 配合 bilibili.debug.live-room-raw-message-log 使用；查完记得改回来
      event-log: false              # 是否把收到的每条直播事件写进 EventDebug/ 目录。
                                    # 排障工具，默认关闭。打开前先知道两件事：
                                    #   1. 写的是完整事件转储，**含观众昵称与 uid**，
                                    #      也就是说你会在磁盘上长期累积他人的个人信息
                                    #   2. 按日期分文件、**不会自动清理**。实测三个房间约 3.8 MB/日
                                    # 排查「事件收到了没有、字段对不对」时打开它，查完记得关掉并清理目录
      network-log: false            # 是否把每次接口请求写进 NetworkDebug/ 目录。
      # 网络日志的同类去重抑制：打开 network-log 后每个请求写一行，而本程序的请求
      # 绝大多数是轮询——三个房间十秒一轮，一小时上千行几乎一样的记录，
      # 要查的那一条异常正好淹在里面。同类按「方法 + 去掉查询串的地址」判定，
      # 被抑制的条数随下一条同类日志一起报出来。失败一律放行，不参与抑制
      network-log-suppress-window: 60   # 抑制窗口，单位：秒，设为 0 关闭抑制
                                    # 同样是排障工具，默认关闭，同样不会自动清理。
                                    # 它记的是请求地址与耗时，排查「慢在哪一跳」时很有用
                                    #（例如本机回环调用比走公网还慢，就是靠它看出来的）

    push:
      enabled: true                 # 全局推送开关。关闭后所有推送都被丢弃，用于调试或临时静音
      quiet-start:                  # 静音时段，格式 HH:mm，两者任一留空即不启用。
      quiet-end:                    # 可跨零点：23:00 ~ 08:00 表示当晚 23 点至次日 8 点。
                                    # 静音期间的消息直接丢弃而非攒着——攒下来会在解除的瞬间集中轰炸

    command:
      prefix:                       # 聊天命令前缀，留空表示直接以命令名触发（如直接发「菜单」）。
                                    # 群里同时有多个机器人容易撞词时可加前缀，如 /

    exec:                           # 收到事件时执行外部程序。开播启动录播、上舰写台账之类，
                                    # 内置功能覆盖不到的用法都从这里接
      enabled: false                # ⚠️ 默认关闭。这是个能执行任意程序的口子，请确认清楚再打开
      timeout: 30                   # 单条命令最长执行时间，单位：秒，超时强制结束
      max-concurrent: 4             # 同时执行的命令数上限，超出的直接丢弃。
                                    # 弹幕类事件一秒能来几十条，没有上限时一次刷屏就等于一次 fork 炸弹
      rules: []
      # rules:
      #   - event: LiveOnEvent      # 事件类名，简名或全限定名皆可，沿继承链匹配，
      #                             # 因此填 LiveOnEvent 可同时命中各平台的具体开播事件
      #     command:                # ⚠️ 第一项是可执行文件，其余各项是独立参数，不是一整行命令。
      #       - /opt/scripts/record.sh    # 想用管道、重定向请自己写脚本文件再填它的路径——
      #       - "{room_id}"                # 把命令拼成一行交给 shell，等于让昵称和弹幕有机会变成命令
      #       - "{uname}"
      #     # 可用占位符：{event} {platform} {uid} {uname} {room_id} {timestamp} {json}

    alert:
      enabled: true                 # 是否启用告警。关闭后登录失效、连接中断等问题只写日志，不主动通知
      convergence-interval: 3600    # 同一问题的最短告警间隔，单位：秒。
                                    # 故障往往持续存在，不收敛会反复推送同一条消息，最终使人对告警脱敏
      qq-platform:                  # 接收告警的推送平台名，填 senders 中的某个 name，留空则不用 QQ 告警。
                                    # 相比邮件，直接推到管理员 QQ 无需另配发件服务，更实用
      qq-type: 0                    # 1 为群聊，0 为私聊。与 datasource.json 中推送目标的 type 同一套编码
      qq-num:                       # 接收告警的群号或 QQ 号

      # ⚠️ QQ 告警走的是机器人自身的推送链路：OneBot 掉线或 QQ 掉登录时，
      #    需要告警的正是这种时候，而 QQ 告警本身也一并失效了。
      #    强烈建议同时配置下面两者之一，它们不经过机器人链路。

      webhook-url:                  # Webhook 告警地址，留空则不启用。只需一个地址，无需密码
      webhook-method: POST          # POST 提交 JSON；GET 把标题与内容拼进查询串（Bark 等用 GET）
      webhook-title-field: title    # JSON 中承载标题的字段名。各服务约定不同，故做成可配置
      webhook-content-field: content   # JSON 中承载内容的字段名
      webhook-headers: {}           # 附加请求头，如 { Authorization: "Bearer xxx" }
      # 常见服务的配法（字段名各家不同，照抄下面即可）：
      #   Bark（iOS 锁屏推送）：url 填 https://api.day.app/<你的key>
      #                        method 填 GET，content-field 改为 body（Bark 的正文字段叫 body）
      #   Server 酱：url 填 https://sctapi.ftqq.com/<你的key>.send
      #             content-field 改为 desp
      #   钉钉/飞书群机器人：需要嵌套结构，当前的扁平字段不适用，建议改用 Bark 或 Server 酱

      # 发不出去的告警会入队重投。需要告警的时候往往正是发不出去的时候：
      # 出网劣化、QQ 掉登录、Webhook 服务抖动，三者本身就是要告警的事，
      # 而告警的出口同时也断了。补发时正文开头写明原始发生时刻与延迟了多久。
      # ⚠️ 队列只在进程内，重启即丢——退出时会把丢掉的几条写进日志，不假装它们送到了
      retry-interval: 60            # 重投间隔，单位：秒，设为 0 关闭重投
      retry-queue-size: 50          # 待重投队列上限。满了丢最旧的，并在日志里说明丢了哪一条
      retry-max-attempts: 10        # 单条最多重投多少次，超过后放弃并写日志

    # 邮件告警。同样不经过机器人链路，可与 Webhook 并存。
    # 注意：仅填下面的 default-to 还不够，发件服务需在文件顶部的 spring.mail 中配置
    # （host / port / username / password 四项缺一不可），否则本通道不会生效
    mail:
      default-to:                   # 接收告警的收件邮箱，留空则不启用邮件告警

    config-ui:
      enabled: true                 # 是否启用配置界面
      token:                        # 访问令牌。留空则每次启动自动生成并输出到日志，
                                    # 需从其他机器访问时在此填入随机串
      allow-ips:                    # 允许访问配置界面的来源，支持 CIDR
        - 127.0.0.1/32
        - ::1/128
      # 口令登录。只有把面板开到公网（放开上面的 allow-ips）时才需要配置这一节，
      # 填了口令后访问令牌就不再是凭据，改为登录换会话
      auth:
        password:                   # 登录口令。留空则不启用。直接填明文即可，
                                    # 启动时会自动换成哈希写回这里，文件中不会留下明文
        totp: true                  # 是否要求二次验证。设了口令却没绑验证器时，
                                    # 界面会持续提示绑定。真的不要就改成 false
        totp-secret:                # 二次验证密钥（Base32）。留空表示尚未绑定，
                                    # 在界面上扫码绑定后会自动写回这里
        operator-token: true        # 是否保留「忘记口令」的启动令牌通道。
                                    # 设了口令之后，启动日志里仍会打印一个带令牌的地址，
                                    # 用它可以**绕过口令与二次验证**直接进入。
                                    # 默认保留：忘记口令时它是唯一不必改配置重启就能进去的路，
                                    # 默认关掉会把人锁在门外，那比留一道后门更糟。
                                    # 🔴 **确认口令与验证器都能用之后就该关掉**，三个理由：
                                    #   ① 它绕过二次验证——留着它，TOTP 的保护上限就是这个令牌的保密程度
                                    #   ② 令牌走地址栏，会进反向代理的访问日志
                                    #   ③ 若把别的服务挂在这套会话之后（如经反代把 OneBot 实现的
                                    #      WebUI 放出去），这个后门会同时成为那些服务的后门
                                    # 关闭后令牌不再被接受，启动日志也不再打印那一行——
                                    # 打印一个不管用的地址比不打印更让人困惑
        session-hours: 168          # 会话有效期，从登录起算，到点必须重新登录
        idle-hours: 12              # 会话闲置多久自动退出
        max-failures: 5             # 同一来源连续失败多少次后锁定
        lockout-minutes: 15         # 首次锁定时长，反复触发时逐次翻倍

      # 把 NapCat 的 WebUI 反代到本控制台路径下、又不想让使用者再单独登录它一次时填这一节。
      # 填了之后，点「打开 NapCat 控制台」时 NovaBot 会替他换一把 NapCat 的凭据，
      # 使用者只在 NovaBot 这一侧配置与操作。没反代就整节留空，界面上也不会出现那个入口。
      napcat:
        token:                      # NapCat WebUI 的 token。填明文即可，启动时会立刻换算成
                                    # 登录哈希写回下一项，明文不留在盘上。
                                    # 🔴 换算出来的哈希与 token 在权限上完全等价——NapCat 的登录接口
                                    # 收的就是它，拿到哈希的人照样登得进去。这一步的收益不是「更安全」，
                                    # 而是不在这台机器上多造一份 token 的副本：原文在 NapCat 自己的
                                    # 配置里本来就有。别把它当成加密后就可以放松保管的东西
        token-hash:                 # 上一项换算出来的哈希，由程序写回，不必手填
        totp-secret:                # NapCat WebUI 的二次验证密钥（Base32）。它开了 2FA 才需要填。
                                    # 只能明文保存：代登录时要用它现算验证码，而算码需要密钥本身——
                                    # 这一点没有折中办法，因此本文件的权限必须收紧到仅属主可读
        address: http://127.0.0.1:6099   # NapCat WebUI 在本机的地址。不该改成非回环地址：
                                    # 代登录是拿着凭据去换凭据，这条请求一旦离开本机，凭据就上了网线
