<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>正在进入 NapCat</title>
  <script>
    // 界面主题与配色记在本浏览器里，与控制台同两把键、同一套取值（见核心的 theme.js）。
    // 首帧前设好，免得先按系统色、默认的粉蓝画一下再切；读不到或读出错，浅深跟系统、配色按粉蓝。
    try {
      var theme = localStorage.getItem('novabot-theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }
      var palette = localStorage.getItem('novabot-palette');
      if (palette === 'classic' || palette === 'pink-blue' || palette === 'warm') {
        document.documentElement.setAttribute('data-palette', palette);
      }
    } catch (e) {}
  </script>
  <!-- 色表用控制台那一份：这一页只给登录过的管理员，/config/assets 此刻开着门。
       不带版本段的地址每次都会核一下新旧，升级后不会拿着旧色表 -->
  <link rel="stylesheet" href="{{nova-prefix}}/config/assets/product-ui.css">
  <style>
    /* 只引 var(--x)，不写色值：配色与浅深跟着本浏览器在控制台里选过的走 */
    * { box-sizing: border-box }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--ground); color: var(--text); font-family: var(--font);
    }
    .box {
      width: 420px; max-width: calc(100vw - 32px); padding: 28px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-card); box-shadow: var(--shadow);
    }
    h1 { margin: 0 0 6px; font-size: var(--fs-lg) }
    p { margin: 0; font-size: var(--fs-sm); color: var(--dim); line-height: 1.7 }
    p.err { color: var(--err) }
    .steps { margin-top: 14px; font-size: var(--fs-xs); color: var(--faint) }
    a { color: var(--accent-text) }
    /* 托住内层的形态：整屏一张 iframe，外层只留一条提示位 */
    body.mounted { display: block; background: var(--ground) }
    body.mounted .box { display: none }
    #frame { display: none; border: 0; width: 100vw; height: 100vh }
    body.mounted #frame { display: block }
    /* 提示条压在 NapCat 页面上：淡底是半透明的，先垫一层不透明的面色，底下的字才不会透上来 */
    #banner {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      padding: 10px 14px; font-size: var(--fs-sm); line-height: 1.6;
      background: linear-gradient(var(--warnsoft), var(--warnsoft)), var(--surface);
      color: var(--warn); border-top: 1px solid var(--warn);
    }
    #banner.show { display: block }
    #banner button {
      float: right; margin-left: 12px; border: 0; border-radius: var(--r-ctl);
      padding: 4px 10px; cursor: pointer; background: var(--warn); color: var(--on-status);
      font-size: var(--fs-xs); font-family: inherit;
    }
  </style>
</head>
<body>
<div class="box">
  <h1 id="title">正在进入 NapCat…</h1>
  <p id="msg">正在获取登录凭据，请稍候。</p>
  <div class="steps" id="steps"></div>
</div>
<iframe id="frame" title="NapCat WebUI"></iframe>
<div id="banner"><button type="button" id="banner-close">关闭提示</button><span id="banner-text"></span></div>

<script src="{{nova-prefix}}/config/napcat-bootstrap/napcat-resume.js"></script>

<script>
  // 部署前缀（server.servlet.context-path），没配时为空串。服务端吐页时按脚本字符串写进来，
  // 这张页面不加载 core.js，本站地址一律经下面这两个值拼。
  // NapCat WebUI 那条反代规则在配了前缀时由使用者写成「前缀 + /config/napcat/」
  const PREFIX = "{{nova-prefix:js}}";
  const CONSOLE = `${PREFIX}/config`;

  // NapCat WebUI 的 localStorage 键名。它那边的常量表里就叫 token，
  // 存的是 Credential（登录响应的那个字段），且是 JSON 编码过的字符串——
  // 它的请求拦截器读出来后会 JSON.parse 再放进 Authorization: Bearer。
  // 🔴 少了 JSON.stringify 这一层，存进去的裸串会被 parse 成异常，
  //    症状是「明明写进去了却还是要登录」
  const KEY = 'token';
  const WEBUI = CONSOLE + '/napcat/webui/';

  const $ = s => document.querySelector(s);
  const step = text => { $('#steps').textContent = text; };

  // 提示里可能带服务端回的原话，只按文字放，不拼进标记
  function fail(text) {
    $('#title').textContent = 'NapCat 自动登录失败';
    const msg = $('#msg');
    msg.className = 'err';
    msg.textContent = text;
    const back = document.createElement('a');
    back.href = CONSOLE;
    back.textContent = '返回 NovaBot 控制台';
    msg.appendChild(document.createElement('br'));
    msg.appendChild(document.createElement('br'));
    msg.appendChild(back);
    $('#steps').textContent = '';
  }

  async function mint(csrf, renew) {
    const res = await fetch(CONSOLE + '/api/napcat/credential' + (renew ? '?renew=true' : ''), {
      method: 'POST', headers: {'X-CSRF-Token': csrf}
    });
    return res.json();
  }

  // 拿这把凭据去问一句 NapCat「我算登录了吗」。
  // 🔴 必须问，不能写完就跳：凭据只活一小时，缓存里那把可能刚好过期，
  //    而过期的表现是跳过去之后被弹回它自己的登录页——那时候使用者只会以为配置错了
  async function accepted(credential) {
    try {
      const res = await fetch(CONSOLE + '/napcat/api/auth/check', {
        method: 'POST', headers: {'Authorization': 'Bearer ' + credential}
      });
      const data = await res.json();
      // NapCat 鉴权失败也回 HTTP 200，错误只在响应体里。只看状态码会一律读成成功
      return data && data.code === 0;
    } catch (e) {
      if (e instanceof TypeError) throw e;
      return false;
    }
  }

  // 🔴 从「跳过去」改成「托住它」，是为了外层留在同一个源上、读得到内层的路径。
  //    整页跳走之后没有任何东西还在跑，会话过期时也就没有谁能救 —— 那正是今天的样子
  function mount(csrf) {
    const frame = document.getElementById('frame');
    document.body.classList.add('mounted');
    frame.src = WEBUI;

    NapCatResume.start({
      frame: frame,
      webuiUrl: WEBUI,
      renew: () => mint(csrf, true),
      persist: credential => localStorage.setItem(KEY, JSON.stringify(credential)),
      onGiveUp: reason => {
        // 停手之后不清 localStorage、不跳转、不弹窗挡住内层：
        // 使用者看到的仍是 NapCat 自己的登录页，照样能手动登录（边界②：回落到现状）
        const text = reason === 'throttled'
          ? '自动续登已被本机的频率限制拦截（短时间内获取凭据次数过多）。请稍候刷新本页，或直接在下方手动登录。'
          : '自动续登失败，请在下方手动登录。若反复出现，请检查 NovaBot 中配置的 NapCat Token 与二次验证密钥是否与 NapCat 当前的设置一致。';
        document.getElementById('banner-text').textContent = text;
        document.getElementById('banner').classList.add('show');
      }
    });

    document.getElementById('banner-close').addEventListener('click', () => {
      document.getElementById('banner').classList.remove('show');
    });
  }

  (async () => {
    let csrf = '';
    try {
      const state = await (await fetch(CONSOLE + '/api/auth/state')).json();
      csrf = state.csrfToken || '';
    } catch (e) {
      fail('无法连接 NovaBot 控制台。');
      return;
    }

    step('① 获取凭据');
    let issued = await mint(csrf, false);
    if (!issued.success) { fail(issued.message || '获取凭据失败。'); return; }

    localStorage.setItem(KEY, JSON.stringify(issued.credential));

    step('② 验证凭据');
    if (!await accepted(issued.credential)) {
      // 🔴 只重换一次，不循环。换不出来的原因几乎总是配置不对，
      //    而那类原因重试多少次都是同一个结果，只会把 NapCat 的登录限流打满
      step('③ 凭据无效，重新获取（仅重试一次）');
      issued = await mint(csrf, true);
      if (!issued.success) { fail(issued.message || '获取凭据失败。'); return; }

      localStorage.setItem(KEY, JSON.stringify(issued.credential));
      if (!await accepted(issued.credential)) {
        localStorage.removeItem(KEY);
        fail('两次获取的凭据均未被 NapCat 接受。通常是 NovaBot 中配置的 NapCat Token 或二次验证密钥'
          + '与 NapCat 当前的设置不一致，多发生在只修改了其中一侧之后。');
        return;
      }
    }

    step('④ 打开 NapCat');
    mount(csrf);
  })().catch(() => fail('无法连接 NovaBot 控制台。'));
</script>
</body>
</html>
