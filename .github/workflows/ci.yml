name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    # 平台默认上限 360 分钟：卡住的运行要挂满它才死。近几回构建＋测试 11–13 分钟，
    # 40 分钟＝约 3 倍余量，盖住冷缓存重下依赖与运行器快慢浮动；再慢多半是真卡了
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 控制台前端是不经构建的 ES module，node 是它唯一的可执行环境。设置页那四组判定
      # 与登录页那八格显隐矩阵都由 JUnit 拉起 node 跑夹具，PATH 上没有它这两格就红
      # （不是跳过——跳过与通过在构建日志上长得一样）。ubuntu-latest 自带 node，
      # 但那是运行器镜像的巧合而不是承诺：显式装一次，版本也就写下来了
      - name: 配置 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 构建与汇总走 ./build.sh 这一个入口：它装构建插件、整测、打可运行包，并把
      # NovaBot.jar＋lib＋plugins＋plugins-lib＋模板汇总到 dist/build —— 汇总那一步
      # 若在这里另写一份（三条 mvn），就是同一落点规则的两份拷贝，改一处漏一处。
      # --no-smoke：冒烟拆成下面单独一步，便于失败时贴长日志尾（build.sh 内置那次只贴短摘要）
      - name: 构建与测试
        run: ./build.sh --no-smoke

      # 起动冒烟（与本地 ./build.sh 内置的是同一把尺 tools/boot-smoke.sh）：
      # 整测全绿与「包起得来」是两件事——单测里每个类都是自己 new 的，谁也不经过容器；
      # 容器到启动那一刻才第一次按类型凑构造参数，凑不齐当场退出。这一步红即本 job 红。
      # 端口不用默认的 7827：runner 上同端口可能有别的服务在听，撞上时那种红
      # 与「装配坏了」的红在退码上长得一样。
      - name: 起动冒烟
        run: |
          set -euo pipefail
          LOG_DIR="$(mktemp -d)"
          if ! BOOT_SMOKE_PORT=17827 BOOT_SMOKE_LOG="$LOG_DIR/boot.log" \
               bash tools/boot-smoke.sh dist/build; then
            # 末 30 行就是这里能带走的全部：$LOG_DIR 在运行器上，job 一结束就没了。
            # 写成「完整件已留 <路径>」会让人以为事后还能去取，取不到——
            # 要真留得住得再加一步 upload-artifact，那时再改这一句
            echo "==> 启动日志末 30 行（完整件只在本次 job 内：$LOG_DIR/boot.log）"
            tail -n 30 "$LOG_DIR/boot.log" || true
            exit 1
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

  dependency-check:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    # 温库带增量更新的整 job 近几回不到 3 分钟，但从零建库要把整个 NVD 数据集
    # 拉下来（见下面「取回漏洞库存档」那步的注释），是几十分钟量级的事；
    # 60 分钟日常绰绰有余、从零建库也装得下，真卡住的早死早省
    timeout-minutes: 60
    # 漏洞库是一套随 NVD 数据增长的 SQL 库，放在 runner 的用户主目录下、仓库之外。
    # 插件说明里查不到 dataDirectory 的默认值：不显式指定，库就落在插件的隐式位置，
    # 没法给它配专用缓存——setup-java 那条 maven 缓存的键跟着 pom 摘要走，pom 一改
    # 就换键，混在里面的漏洞库跟着重置；放进 checkout 出来的树里则会混进汇总步
    # find . 的报告搜索。路径只在这一处定义，下面的缓存步与扫描命令都引用它
    env:
      DC_DATA_DIR: /home/runner/dependency-check-data
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          # 这里不开 cache: maven：它取完总要在 job 收尾存一份，而本 job 与
          # 构建 job 同用一个键——缓存键存下就不可覆盖，先收尾的把键占死，
          # 另一份的新增内容永远存不进去。本 job 只取不存，见下面单独的取回步
      # Maven 依赖缓存只取不存：两个 job 此前都开 setup-java 的 cache: maven
      # （同键取＋存），谁后收尾谁存不进（日志报 Unable to reserve cache）。
      # 先收尾的常是本 job——它 -DskipTests，件集是构建 job 的子集，缓存里
      # 从此少了测试期才用的件，构建 job 只能每回重下。改成只有构建 job 存：
      # 本 job 用 cache/restore 只取。取回要与存方逐字对上，三处都照 setup-java
      # v6 的存法写（源码 src/cache.ts）：
      # https://raw.githubusercontent.com/actions/setup-java/v6/src/cache.ts
      # 路径：setup-java 存的是 join(os.homedir(), '.m2', 'repository') 在
      #   GitHub 托管 Ubuntu 运行器上的展开值。路径字串原样参与缓存版本的
      #   计算（@actions/cache 的 getCacheVersion），写成 ~/ 或别的拼法就算
      #   另一个版本，主键与前缀键都取不回，所以这里写死绝对路径
      # arch 段：setup-java 取的是 Node 的 process.arch，小写 x64；GitHub
      #   表达式 runner.arch 给大写 X64，不是同一串。照存方写死 x64
      # 摘要段：与 setup-java 对 maven 的口径同为全部 pom.xml 的散列
      # 两级 restore-keys 前缀留着兜底：精确键没命中（比如 pom 刚改过）时先
      # 取最近一份；兜底前缀同样带上 arch 段，免得兜底也差一截取空
      - name: 取回 Maven 依赖缓存
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.m2/repository
          key: setup-java-${{ runner.os }}-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-${{ runner.os }}-x64-maven-
            setup-java-

      - name: 安装构建插件
        run: mvn -B -f build-tools/nova-plugin-processor/pom.xml install -DskipTests

      # 缓存键按 UTC 日期逐日换新：同一天的重跑共享同一份存档，跨天自动开新的；
      # restore-keys 前缀兜底＝哪怕隔了些天，也先取回最近一份，扫描时只补增量。
      # 从零建库要把整个 NVD 数据集拉下来，是这一 job 里最耗时、最容易超时的一段
      - name: 记下当天日期做缓存键
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # 取与存拆成两步（cache/restore 与 cache/save）：一体的 actions/cache 在 job
      # 收尾无条件保存，而扫描步带 continue-on-error——缺密钥、NVD 超时、下载到一半
      # 断掉时 job 仍算成功，后置保存照样把当天那份空的或半截的库存进缓存。
      # 缓存键存下就不能覆盖：当天重跑都还原这份坏库，次日 restore-keys 又可能
      # 取回它，报告缺数据或接连失败，运行页却只见黄、看不出根子在缓存。
      # 这一步只取（键与前缀与原先相同），存挪到扫描之后、看扫描结果才做
      - name: 取回漏洞库存档
        id: dc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: dependency-check-data-${{ steps.today.outputs.date }}
          restore-keys: |
            dependency-check-data-

      - name: 扫描已知漏洞
        # 给汇总步留个把手：本步骤带 continue-on-error，失败会被吞掉，job 照样绿；
        # 汇总步要靠 steps.scan.outcome 才知道这次到底扫没扫成
        id: scan
        # 本步骤**只出报告，永不阻断构建**：上游依赖的修复节奏不受本仓库控制。
        #
        # ⚠️ 这里原本还带着 -DfailBuildOnCVSS=8。那个参数在 continue-on-error: true
        # 之下**没有任何效果**——阈值再低也拦不住构建，却让读到它的人以为
        # CVSS≥8 会被拦下。**配置在撒谎比配置缺失更糟**，已删除。
        continue-on-error: true
        # 出 JSON 不出 CSV：CSV 的描述字段含逗号，任何按分隔符切列的读法都会错位，
        # 而错位的表现是「没找到高危」——与真的没有高危一模一样
        # 插件版本钉死在 13.0.0：坐标不带版本时 Maven 每次解析成 13.x 的最新版，
        # 参数名、报告格式、漏洞库的存放格式都可能随上游小版本变——扫描器的行为
        # 不该跟着别人家的发版漂
        #
        # OSS Index 分析器显式关掉：本仓没配它的凭据，无凭据时它本来也会被插件
        # 自动禁用（日志一行 disabled due to missing credentials）——但「自动禁用」
        # 只发生在运行时，配置面看不出这轮到底用了哪些来源。显式写 false，
        # 配置即答案；汇总步的 SCAN_SOURCES 也以此为准。参数名以 13.0.0 源码为
        # 准（BaseDependencyCheckMojo.java:742 的 @Parameter）：property 是
        # ossIndexAnalyzerEnabled（Index 的 I 大写），命令行 -D 认的是它；全小写
        # 的 ossindexAnalyzerEnabled 只是 pom <configuration> 里按元素名认的
        # alias，写在命令行上插件不认：
        # https://raw.githubusercontent.com/dependency-check/DependencyCheck/v13.0.0/maven/src/main/java/org/owasp/dependencycheck/maven/BaseDependencyCheckMojo.java
        #
        # 命令里的 package 是生命周期阶段，与 -Pinstall 开的那个 profile 是两回事：
        # 只起插件 goal 不带阶段时，这一趟构建不出任何本仓构件，goal 逐模块解析依赖
        # 只能去中央库找 novacore／nova-core——它们从没发布过，于是从第三个模块起
        # 解析失败、报告 SKIPPED。阶段写在 goal 前面，同一趟先把八个模块构建出来，
        # 下游模块在同一趟 reactor 里从兄弟模块的构建产物拿到本仓件，不去中央库找。
        # 阶段到 package 为止：构件已构建出来就够 goal 用了，多走的 install 还会把
        # 本仓构件写进运行器的本机仓库——这里取回的 Maven 缓存是只取不存的共享
        # 底子，往里塞一趟性的本仓构件没有收益，只会把这趟动过的东西变浑。
        # 测试照旧跳过，本 job 也不需要配 Node：各模块 pom 没有任何生命周期阶段
        # 绑着 node／npm（控制台前端是不经构建的 ES module），唯一会拉起 node 的
        # 是 JUnit 夹具，-DskipTests 之下走不到
        #
        # 密钥只经环境变量进扫描步：插件说明点名直接用 -DnvdApiKey 递值会让 Maven
        # 调试日志把密钥打出来（GHSA-qqhq-8r2c-c3f5），并写明 CI 场景的推荐传法是
        # nvdApiKeyEnvironmentVariable。命令行里这个 -D 带的只是环境变量的名字、
        # 不是值——命令行会原样进日志，值由 Actions 从仓库密钥库注入 env
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Pinstall package org.owasp:dependency-check-maven:13.0.0:check -Dformat=JSON -DskipTests -DossIndexAnalyzerEnabled=false -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DdataDirectory="$DC_DATA_DIR"

      # 报告不落附件就留不住：job summary 只贴高危摘录，整份 JSON（含未过阈值的
      # 条目与依赖明细）只在运行器磁盘上，job 一结束就没了，事后想逐条核对已无处
      # 可取。扫描没扫成也要传：扫描步 continue-on-error，失败被吞，这里 if: always()
      # 照样执行，有几份传几份；一份都没有也不算错（if-no-files-found: ignore）——
      # 空附件与汇总步的黄字一样，是「这次没扫成」的证据，不是要绕过的错
      - name: 上传漏洞扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: '**/dependency-check-report.json'
          if-no-files-found: ignore

      # 扫成才存：库没建全就存，存下的半截库比没有缓存更糟（缘由见上面取那步的
      # 注释）。两个条件缺一不可——扫描没扫成（outcome 不是 success）不存；
      # 取那步已精确命中当天键也不存：缓存不可变，同键再存是无用功。
      # 键引用取那步给出的主键，不在第二处再写一遍日期表达式，免得两处各自漂移
      - name: 存回漏洞库存档
        if: steps.scan.outcome == 'success' && steps.dc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: ${{ steps.dc-cache.outputs.cache-primary-key }}

      # 不阻断，但不能让高危悄悄溜过去：结果显式贴到 job summary。
      # 「不阻断」省下的阻塞成本，必须用可见性补回来，否则等于没扫。
      # 汇总与验单的逻辑在 .github/scripts/summarize-dependency-check.sh：
      # 报告要先过结构检查、份数要与根 pom 推得的应出数对账，坏了缺了逐份
      # 点名并亮 ::warning::，绝不把「判不动」说成「未发现」。
      # 这一步先确认检查脚本本身是好的（阳性对照），再看它报什么——检查脚本
      # 失灵时，解析坏掉的表现与真的没有漏洞完全一样；整套做法与理由写在
      # 脚本开头的注释里
      - name: 高危漏洞进 job summary
        if: always()
        env:
          # 扫描步骤的 continue-on-error 让 job 永远绿着；outcome 是它被豁免前的
          # 真实结果，「这次扫没扫成」要靠它判断，不能靠 job 结论
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          # 只用来判空、绝不回显：密钥缺失是「没扫成」最常见的成因，
          # 值得在运行页上单独点名，但值本身一个字节都不能落到日志里
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # 本次配置的数据来源一句话，与上面扫描命令里的分析器开关同源；
          # 汇总脚本原样贴进 job summary，读的人才知道这轮看了哪些库
          SCAN_SOURCES: '漏洞数据取自 NVD；Sonatype OSS Index 分析器已显式关闭（未配其凭据）'
        run: |
          set -euo pipefail
          chmod +x .github/scripts/high-cvss.sh .github/scripts/no-cvssv3.sh .github/scripts/summarize-dependency-check.sh
          .github/scripts/summarize-dependency-check.sh
