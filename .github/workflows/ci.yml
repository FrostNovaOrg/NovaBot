name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # starbot-plugin-processor 是各插件模块在 build 阶段调用的 Maven 插件，
      # Maven 无法在同一 reactor 内构建并使用同一个插件，因此需先单独安装
      - name: 安装构建插件
        run: mvn -B -f build-tools/starbot-plugin-processor/pom.xml install -DskipTests

      - name: 构建与测试
        run: mvn -B -Pinstall install

      - name: 打包发行产物
        run: mvn -B -f starbot-core/pom.xml -Ppackage package

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

  dependency-check:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 安装构建插件
        run: mvn -B -f build-tools/starbot-plugin-processor/pom.xml install -DskipTests

      - name: 扫描已知漏洞
        # 本步骤**只出报告，永不阻断构建**：上游依赖的修复节奏不受本仓库控制。
        #
        # ⚠️ 这里原本还带着 -DfailBuildOnCVSS=8。那个参数在 continue-on-error: true
        # 之下**没有任何效果**——阈值再低也拦不住构建，却让读到它的人以为
        # CVSS≥8 会被拦下。**配置在撒谎比配置缺失更糟**，已删除。
        continue-on-error: true
        run: mvn -B -Pinstall org.owasp:dependency-check-maven:check -Dformat=CSV -DskipTests

      # 不阻断，但不能让高危悄悄溜过去：结果显式贴到 job summary。
      # 「不阻断」省下的阻塞成本，必须用可见性补回来，否则等于没扫。
      - name: 高危漏洞进 job summary
        if: always()
        run: |
          {
            echo "## 依赖漏洞扫描"
            REPORT=$(find . -name 'dependency-check-report.csv' | head -1)
            if [ -z "$REPORT" ]; then
              # ⚠️ 报告缺失和「没有漏洞」长得一样，必须分开说，否则这块永远是绿的
              echo "⚠️ **未找到报告文件**——扫描步骤可能根本没跑成。"
              echo "别把这一栏的空白当成「没有漏洞」。"
            else
              HIGH=$(awk -F',' 'NR>1 && $NF+0 >= 7' "$REPORT" | wc -l | tr -d ' ')
              echo "报告：\`$REPORT\`"
              if [ "$HIGH" = "0" ]; then
                echo "✅ 本次未发现 CVSS ≥ 7 的条目。"
              else
                echo "🔴 **发现 $HIGH 条 CVSS ≥ 7 的依赖漏洞**（不阻断构建，但请处理）："
                echo '```'
                awk -F',' 'NR>1 && $NF+0 >= 7 {print $2, $3, "CVSS="$NF}' "$REPORT" | sort -u | head -40
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
