name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 控制台前端是不经构建的 ES module，node 是它唯一的可执行环境。设置页那四组判定
      # 与登录页那八格显隐矩阵都由 JUnit 拉起 node 跑夹具，PATH 上没有它这两格就红
      # （不是跳过——跳过与通过在构建日志上长得一样）。ubuntu-latest 自带 node，
      # 但那是运行器镜像的巧合而不是承诺：显式装一次，版本也就写下来了
      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 构建与汇总走 ./build.sh 这一个入口：它装构建插件、整测、打可运行包，并把
      # StarBotCore.jar＋lib＋plugins＋plugins-lib＋模板汇总到 dist/build —— 汇总那一步
      # 若在这里另写一份（三条 mvn），就是同一落点规则的两份拷贝，改一处漏一处。
      # --no-smoke：冒烟拆成下面单独一步，便于失败时贴长日志尾（build.sh 内置那次只贴短摘要）
      - name: 构建与测试
        run: ./build.sh --no-smoke

      # 起动冒烟（与本地 ./build.sh 内置的是同一把尺 tools/boot-smoke.sh）：
      # 整测全绿与「包起得来」是两件事——单测里每个类都是自己 new 的，谁也不经过容器；
      # 容器到启动那一刻才第一次按类型凑构造参数，凑不齐当场退出。这一步红即本 job 红。
      # 端口不用默认的 7827：runner 上同端口可能有别的服务在听，撞上时那种红
      # 与「装配坏了」的红在退码上长得一样。
      - name: 起动冒烟
        run: |
          set -euo pipefail
          LOG_DIR="$(mktemp -d)"
          if ! BOOT_SMOKE_PORT=17827 BOOT_SMOKE_LOG="$LOG_DIR/boot.log" \
               bash tools/boot-smoke.sh dist/build; then
            # 末 30 行就是这里能带走的全部：$LOG_DIR 在运行器上，job 一结束就没了。
            # 写成「完整件已留 <路径>」会让人以为事后还能去取，取不到——
            # 要真留得住得再加一步 upload-artifact，那时再改这一句
            echo "==> 启动日志末 30 行（完整件只在本次 job 内：$LOG_DIR/boot.log）"
            tail -n 30 "$LOG_DIR/boot.log" || true
            exit 1
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

  dependency-check:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 安装构建插件
        run: mvn -B -f build-tools/starbot-plugin-processor/pom.xml install -DskipTests

      - name: 扫描已知漏洞
        # 本步骤**只出报告，永不阻断构建**：上游依赖的修复节奏不受本仓库控制。
        #
        # ⚠️ 这里原本还带着 -DfailBuildOnCVSS=8。那个参数在 continue-on-error: true
        # 之下**没有任何效果**——阈值再低也拦不住构建，却让读到它的人以为
        # CVSS≥8 会被拦下。**配置在撒谎比配置缺失更糟**，已删除。
        continue-on-error: true
        # 出 JSON 不出 CSV：CSV 的描述字段含逗号，任何按分隔符切列的读法都会错位，
        # 而错位的表现是「没找到高危」——与真的没有高危一模一样
        run: mvn -B -Pinstall org.owasp:dependency-check-maven:check -Dformat=JSON -DskipTests

      # 不阻断，但不能让高危悄悄溜过去：结果显式贴到 job summary。
      # 「不阻断」省下的阻塞成本，必须用可见性补回来，否则等于没扫。
      #
      # 🔴 这一步先确认检查脚本本身是好的，再看它报什么。上一版就是脚本坏了却一直绿着：
      # 用 CSV 最后一列当分数，而最后一列是 Notes（空串），于是
      # 「CVSS ≥ 7」恒不成立，summary 每次都打印「✅ 未发现」。
      # **解析坏掉的表现与真的没有漏洞完全一样**，所以必须有阳性对照。
      - name: 高危漏洞进 job summary
        if: always()
        run: |
          set -euo pipefail
          chmod +x .github/scripts/high-cvss.sh .github/scripts/no-cvssv3.sh

          # ① 先确认脚本本身能用：对照报告里有一条写死的 9.8，抓不到它就说明解析坏了。
          #    这一条**允许失败整个步骤**——尺子坏掉时给出的「未发现」比不给更危险，
          #    它不是漏洞不阻断的那个议题，它是工具本身坏了
          CONTROL=$(.github/scripts/high-cvss.sh .github/fixtures/dependency-check-control.json 7 | wc -l | tr -d ' ')
          if [ "$CONTROL" != "1" ]; then
            echo "::error::漏洞统计的阳性对照失败（期望 1 条，实得 $CONTROL）——本次扫描结果不可信"
            exit 1
          fi

          # ② 所有模块的报告都要看。上一版 `find | head -1` 只取第一份，
          #    其余模块的结果整个不看，而那同样表现为「没发现」
          mapfile -t REPORTS < <(find . -name 'dependency-check-report.json' | sort)

          {
            echo "## 依赖漏洞扫描"
            echo "（阳性对照已通过：解析器能在对照报告里抓出那条 9.8）"
            if [ "${#REPORTS[@]}" -eq 0 ]; then
              # ⚠️ 报告缺失和「没有漏洞」长得一样，必须分开说，否则这块永远是绿的
              echo "⚠️ **未找到报告文件**——扫描步骤可能根本没跑成。"
              echo "别把这一栏的空白当成「没有漏洞」。"
            else
              echo "报告 ${#REPORTS[@]} 份：$(printf '`%s` ' "${REPORTS[@]}")"
              HIGH=$(for r in "${REPORTS[@]}"; do .github/scripts/high-cvss.sh "$r" 7; done | sort -u)
              COUNT=$(printf '%s' "$HIGH" | grep -c . || true)
              if [ "$COUNT" = "0" ]; then
                echo "✅ 本次未发现 CVSSv3 ≥ 7 的条目。"
              else
                echo "🔴 **发现 $COUNT 条 CVSSv3 ≥ 7 的依赖漏洞**（不阻断构建，但请处理）："
                echo '```'
                printf '%s\n' "$HIGH" | head -40
                echo '```'
                [ "$COUNT" -gt 40 ] && echo "（上面只列了前 40 条，共 $COUNT 条）"
              fi

              # 只有 CVSSv2 的旧条目不参与上面的阈值判定。不报出来就等于
              # 把「没判到它」说成「它不高危」——同一个病的小号版本
              NOV3=$(for r in "${REPORTS[@]}"; do .github/scripts/no-cvssv3.sh "$r"; done | sort -u)
              NOV3_COUNT=$(printf '%s' "$NOV3" | grep -c . || true)
              if [ "$NOV3_COUNT" != "0" ]; then
                echo ""
                echo "ℹ️ 另有 **$NOV3_COUNT 条没有 CVSSv3 分数**（多为只有 CVSSv2 的旧条目），"
                echo "未参与上面的阈值判定，需要人工过目："
                echo '```'
                printf '%s\n' "$NOV3" | head -20
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
