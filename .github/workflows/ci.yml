name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    # 平台默认上限 360 分钟：卡住的运行要挂满它才死。近几回构建＋测试 11–13 分钟，
    # 40 分钟＝约 3 倍余量，盖住冷缓存重下依赖与运行器快慢浮动；再慢多半是真卡了
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 控制台前端是不经构建的 ES module，node 是它唯一的可执行环境。设置页那四组判定
      # 与登录页那八格显隐矩阵都由 JUnit 拉起 node 跑夹具，PATH 上没有它这两格就红
      # （不是跳过——跳过与通过在构建日志上长得一样）。ubuntu-latest 自带 node，
      # 但那是运行器镜像的巧合而不是承诺：显式装一次，版本也就写下来了
      - name: 配置 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 构建与汇总走 ./build.sh 这一个入口：它装构建插件、整测、打可运行包，并把
      # NovaBot.jar＋lib＋plugins＋plugins-lib＋模板汇总到 dist/build —— 汇总那一步
      # 若在这里另写一份（三条 mvn），就是同一落点规则的两份拷贝，改一处漏一处。
      # --no-smoke：冒烟拆成下面单独一步，便于失败时贴长日志尾（build.sh 内置那次只贴短摘要）
      - name: 构建与测试
        run: ./build.sh --no-smoke

      # 起动冒烟（与本地 ./build.sh 内置的是同一把尺 tools/boot-smoke.sh）：
      # 整测全绿与「包起得来」是两件事——单测里每个类都是自己 new 的，谁也不经过容器；
      # 容器到启动那一刻才第一次按类型凑构造参数，凑不齐当场退出。这一步红即本 job 红。
      # 端口不用默认的 7827：runner 上同端口可能有别的服务在听，撞上时那种红
      # 与「装配坏了」的红在退码上长得一样。
      - name: 起动冒烟
        run: |
          set -euo pipefail
          LOG_DIR="$(mktemp -d)"
          if ! BOOT_SMOKE_PORT=17827 BOOT_SMOKE_LOG="$LOG_DIR/boot.log" \
               bash tools/boot-smoke.sh dist/build; then
            # 末 30 行就是这里能带走的全部：$LOG_DIR 在运行器上，job 一结束就没了。
            # 写成「完整件已留 <路径>」会让人以为事后还能去取，取不到——
            # 要真留得住得再加一步 upload-artifact，那时再改这一句
            echo "==> 启动日志末 30 行（完整件只在本次 job 内：$LOG_DIR/boot.log）"
            tail -n 30 "$LOG_DIR/boot.log" || true
            exit 1
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

  dependency-check:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    # 数据源慢、连不上时最久的是扫描步，它另有自己的 20 分钟上限（理由见那步的
    # 注释），到点只是那一步失败、汇总步亮黄。job 级上限兜的是其余步骤（检出、
    # 装 JDK、取缓存、装构建插件、存回、汇总）：实测扫描步之前的各步合计 20 秒
    # （run 39771847117，11:36:28 → 11:36:48），之后的各步约 6 秒；Maven 缓存冷时
    # 要重下依赖，会久些。27＝20 分钟扫描＋7 分钟留给它们。
    # 两头都有约束：
    #   比扫描步宽——不宽出这一截，扫描步拖到头时整个 job 先被停，汇总步跑不到，
    #     整次 CI 判 cancelled；
    #   比 30 分钟窄——发版推送脚本推上去后最多等整次 CI 30 分钟
    #     （tools/release/ci-status.sh 的 CI_MAX=1800），过了就不再等、按等待超时
    #     退出，哪怕 CI 稍后转绿。别的步骤真卡住时，27 分钟也让这个 job 先于它出
    #     结论（构建 job 的上限另见文件开头那段）。
    timeout-minutes: 27
    # 漏洞库是一套随漏洞数据增长的 SQL 库，放在 runner 的用户主目录下、仓库之外。
    # 插件说明里查不到 dataDirectory 的默认值：不显式指定，库就落在插件的隐式位置，
    # 没法给它配专用缓存——setup-java 那条 maven 缓存的键跟着 pom 摘要走，pom 一改
    # 就换键，混在里面的漏洞库跟着重置；放进 checkout 出来的树里则会混进汇总步
    # find . 的报告搜索。路径只在这一处定义，下面的缓存步与扫描命令都引用它
    env:
      DC_DATA_DIR: /home/runner/dependency-check-data
    steps:
      - uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          # 这里不开 cache: maven：它取完总要在 job 收尾存一份，而本 job 与
          # 构建 job 同用一个键——缓存键存下就不可覆盖，先收尾的把键占死，
          # 另一份的新增内容永远存不进去。本 job 只取不存，见下面单独的取回步
      # Maven 依赖缓存只取不存：两个 job 此前都开 setup-java 的 cache: maven
      # （同键取＋存），谁后收尾谁存不进（日志报 Unable to reserve cache）。
      # 先收尾的常是本 job——它 -DskipTests，件集是构建 job 的子集，缓存里
      # 从此少了测试期才用的件，构建 job 只能每回重下。改成只有构建 job 存：
      # 本 job 用 cache/restore 只取。取回要与存方逐字对上，三处都照 setup-java
      # v6 的存法写（源码 src/cache.ts）：
      # https://raw.githubusercontent.com/actions/setup-java/v6/src/cache.ts
      # 路径：setup-java 存的是 join(os.homedir(), '.m2', 'repository') 在
      #   GitHub 托管 Ubuntu 运行器上的展开值。路径字串原样参与缓存版本的
      #   计算（@actions/cache 的 getCacheVersion），写成 ~/ 或别的拼法就算
      #   另一个版本，主键与前缀键都取不回，所以这里写死绝对路径
      # arch 段：setup-java 取的是 Node 的 process.arch，小写 x64；GitHub
      #   表达式 runner.arch 给大写 X64，不是同一串。照存方写死 x64
      # 摘要段：与 setup-java 对 maven 的口径同为全部 pom.xml 的散列
      # 两级 restore-keys 前缀留着兜底：精确键没命中（比如 pom 刚改过）时先
      # 取最近一份；兜底前缀同样带上 arch 段，免得兜底也差一截取空
      - name: 取回 Maven 依赖缓存
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.m2/repository
          key: setup-java-${{ runner.os }}-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-${{ runner.os }}-x64-maven-
            setup-java-

      - name: 安装构建插件
        run: mvn -B -f build-tools/nova-plugin-processor/pom.xml install -DskipTests

      # 缓存键按 UTC 日期逐日换新：同一天的重跑共享同一份存档，跨天自动开新的；
      # restore-keys 前缀兜底＝哪怕隔了些天，也先取回最近一份，扫描时只补增量。
      # 从零建库要把整个漏洞数据集拉下来，是这一 job 里最耗时、最容易超时的一段；
      # 增量更新只取上回之后改过的条目，对数据源免费额度的压力也最小
      - name: 记下当天日期做缓存键
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # 取与存拆成两步（cache/restore 与 cache/save）：一体的 actions/cache 在 job
      # 收尾无条件保存，而扫描步带 continue-on-error——缺密钥、数据源超时、下载到一半
      # 断掉时 job 仍算成功，后置保存照样把当天那份空的或半截的库存进缓存。
      # 缓存键存下就不能覆盖：当天重跑都还原这份坏库，次日 restore-keys 又可能
      # 取回它，报告缺数据或接连失败，运行页却只见黄、看不出根子在缓存。
      # 这一步只取（键与前缀与原先相同），存挪到扫描之后、看扫描结果才做
      - name: 取回漏洞库存档
        id: dc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: dependency-check-data-${{ steps.today.outputs.date }}
          restore-keys: |
            dependency-check-data-

      - name: 扫描已知漏洞
        # 给汇总步留个把手：本步骤带 continue-on-error，失败会被吞掉，job 照样绿；
        # 汇总步要靠 steps.scan.outcome 才知道这次到底扫没扫成
        id: scan
        # 本步骤**只出报告，永不阻断构建**：上游依赖的修复节奏不受本仓库控制。
        #
        # ⚠️ 这里原本还带着 -DfailBuildOnCVSS=8。那个参数在 continue-on-error: true
        # 之下**没有任何效果**——阈值再低也拦不住构建，却让读到它的人以为
        # CVSS≥8 会被拦下。**配置在撒谎比配置缺失更糟**，已删除。
        continue-on-error: true
        # 步级上限：数据源再慢或连不上，到点停的只是这一步。runner 把步级超时
        # 记为失败（不是取消），continue-on-error 再把它改记成功、outcome 留
        # failure——与扫描命令自己退非零是同一条路，job 不判败，后面的「存回」
        # 看 outcome 不存半截库，汇总步照常跑、亮黄字「没扫成」。
        # GitHub 文档对两者各有一句——continue-on-error："Prevents a job from failing
        # when a step fails."；timeout-minutes："The maximum number of minutes to run
        # the step before killing the process."——但没说两者合用时怎么算，所以出处
        # 以 actions/runner 源码为准：
        #   https://github.com/actions/runner/blob/a3df03d35a925d4e832af530442be1eea7412df4/src/Runner.Worker/StepsRunner.cs
        #     :313 SetTimeout 给这一步上闹钟；:322 catch (OperationCanceledException)，
        #     :324-325 判的是这一步的令牌被取消、job 的没被取消（即步级超时），
        #     :328 记 "The action '…' has timed out after N minutes."，
        #     :329 Result = TaskResult.Failed；TaskResult.Canceled 只在 :336 的 else
        #     分支（job 被取消）；:353 调 ApplyContinueOnError
        #   https://github.com/actions/runner/blob/b6d10b59c178914d331bcf03823133d5f9e366bb/src/Runner.Worker/ExecutionContext.cs
        #     :1433 ApplyContinueOnError；:1435 Result 不是 Failed 就直接返回；
        #     :1455-1456 Outcome = Result; Result = TaskResult.Succeeded
        # 取 20 分钟：上一回绿的扫描步 1 分 37 秒（run 39185792921，01:32:41 →
        # 01:34:18），20 分钟仍是实测的十来倍，盖住数据源一时变慢；更慢的那种
        # （换源前 NVD 曾慢到一页 12.9 MB 60 秒只到 1.5 MB，把整个 job 拖满 60 分钟
        # 被停）多等也等不出来，不如这一步认栽、下回从同一份旧库再补。上限还受
        # job 级那 27 分钟管着，理由见 job 开头的注释。
        # 缓存被清空、要从零建库时 20 分钟未必够：那时会接连亮黄，看得见
        timeout-minutes: 20
        # 出 JSON 不出 CSV：CSV 的描述字段含逗号，任何按分隔符切列的读法都会错位，
        # 而错位的表现是「没找到高危」——与真的没有高危一模一样
        # 插件版本钉死在 13.0.0：坐标不带版本时 Maven 每次解析成 13.x 的最新版，
        # 参数名、报告格式、漏洞库的存放格式都可能随上游小版本变——扫描器的行为
        # 不该跟着别人家的发版漂
        #
        # OSS Index 分析器显式关掉：本仓没配它的凭据，无凭据时它本来也会被插件
        # 自动禁用（日志一行 disabled due to missing credentials）——但「自动禁用」
        # 只发生在运行时，配置面看不出这轮到底用了哪些来源。显式写 false，
        # 配置即答案；汇总步的 SCAN_SOURCES 也以此为准。参数名以 13.0.0 源码为
        # 准（BaseDependencyCheckMojo.java:742 的 @Parameter）：property 是
        # ossIndexAnalyzerEnabled（Index 的 I 大写），命令行 -D 认的是它；全小写
        # 的 ossindexAnalyzerEnabled 只是 pom <configuration> 里按元素名认的
        # alias，写在命令行上插件不认：
        # https://raw.githubusercontent.com/dependency-check/DependencyCheck/v13.0.0/maven/src/main/java/org/owasp/dependencycheck/maven/BaseDependencyCheckMojo.java
        #
        # 命令里的 package 是生命周期阶段，与 -Pinstall 开的那个 profile 是两回事：
        # 只起插件 goal 不带阶段时，这一趟构建不出任何本仓构件，goal 逐模块解析依赖
        # 只能去中央库找 novacore／nova-core——它们从没发布过，于是从第三个模块起
        # 解析失败、报告 SKIPPED。阶段写在 goal 前面，同一趟先把八个模块构建出来，
        # 下游模块在同一趟 reactor 里从兄弟模块的构建产物拿到本仓件，不去中央库找。
        # 阶段到 package 为止：构件已构建出来就够 goal 用了，多走的 install 还会把
        # 本仓构件写进运行器的本机仓库——这里取回的 Maven 缓存是只取不存的共享
        # 底子，往里塞一趟性的本仓构件没有收益，只会把这趟动过的东西变浑。
        # 测试照旧跳过，本 job 也不需要配 Node：各模块 pom 没有任何生命周期阶段
        # 绑着 node／npm（控制台前端是不经构建的 ES module），唯一会拉起 node 的
        # 是 JUnit 夹具，-DskipTests 之下走不到
        #
        # 数据源：VulnCheck 的 NVD 兼容接口（与 NVD API 2.0 同路径、同参数、同返回
        # 结构），经 nvdApiEndpoint 换掉插件默认的 NVD 地址。出处（13.0.0 源码）：
        #   插件 BaseDependencyCheckMojo.java:1044 的 @Parameter(property = "nvdApiEndpoint")，
        #     :2483 写进 Settings.KEYS.NVD_API_ENDPOINT；
        #   core 的 data/update/NvdApiDataSource.java:293-296 读它交给
        #     NvdCveClientBuilder.withEndpoint，没给才用 NVD 默认地址
        #
        # 令牌只经环境变量进扫描步：插件说明点名直接用 -DnvdApiKey 递值会让 Maven
        # 调试日志把它打出来（GHSA-qqhq-8r2c-c3f5），并写明 CI 场景的推荐传法是
        # nvdApiKeyEnvironmentVariable。命令行里这个 -D 带的只是环境变量的名字、
        # 不是值——命令行会原样进日志，值由 Actions 从仓库密钥库注入 env。
        # 令牌在请求里走的是 apiKey 请求头，正是 VulnCheck 文档认的两种放法之一：
        #   插件 BaseDependencyCheckMojo.java:1032 的 @Parameter(property =
        #     "nvdApiKeyEnvironmentVariable")，:2489-2491 按这个名字取环境变量的值
        #     写进插件的 API 密钥设置项；
        #   core 的 NvdApiDataSource.java:303-306 读它交给 NvdCveClientBuilder.withApiKey；
        #   open-vulnerability-clients 9.0.6（13.0.0 父 pom 钉的版本）的
        #     client/nvd/NvdCveClient.java:78 API_KEY_NAME = "apiKey"，
        #     :294-295 builder.addHeader(API_KEY_NAME, apiKey)
        #
        # 公开仓的运行日志谁都能看，而 VulnCheck 的条款不许把它的数据免费转给他人：
        # 日志里不列分数、描述，也不列「某依赖有某漏洞」。
        # 插件默认在扫完后按依赖逐条列出漏洞编号（core 的
        # agent/DependencyCheckScanAgent.java:1070 showSummary），showSummary=false
        # 关掉的就是这一段。出处：插件 BaseDependencyCheckMojo.java:398 的
        # @Parameter(property = "showSummary", defaultValue = "true")，:2953-2955
        # 只在它为真时调用上面那个方法。
        # 关不掉的：个别出错路径的报错行里仍可能带出单个 CVE 编号（core 的
        # data/update/nvd/api/NvdApiProcessor.java:121 某条入库失败时、
        # data/nvdcve/CveDB.java:1493／1553／1727 主键重复时）。编号是 CVE 计划公开
        # 分配的标识，不带 VulnCheck 的数据内容，所以不另做日志过滤。
        # 同理，整份报告不再落附件：公开仓的附件任何登录用户都能下，报告里全是
        # VulnCheck 的数据；它只留在运行器磁盘上，供汇总步数数，job 结束即没
        env:
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
        run: >-
          mvn -B -Pinstall package org.owasp:dependency-check-maven:13.0.0:check
          -Dformat=JSON -DskipTests -DossIndexAnalyzerEnabled=false -DshowSummary=false
          -DnvdApiEndpoint=https://api.vulncheck.com/rest/json/cves/2.0
          -DnvdApiKeyEnvironmentVariable=VULNCHECK_API_TOKEN
          -DdataDirectory="$DC_DATA_DIR"

      # 扫成才存：库没建全就存，存下的半截库比没有缓存更糟（缘由见上面取那步的
      # 注释）。两个条件缺一不可——扫描没扫成（outcome 不是 success）不存；
      # 取那步已精确命中当天键也不存：缓存不可变，同键再存是无用功。
      # 键引用取那步给出的主键，不在第二处再写一遍日期表达式，免得两处各自漂移
      - name: 存回漏洞库存档
        if: steps.scan.outcome == 'success' && steps.dc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: ${{ steps.dc-cache.outputs.cache-primary-key }}

      # 不阻断，但不能让高危悄悄溜过去：计数显式贴到 job summary，同一行也打进日志。
      # 「不阻断」省下的阻塞成本，必须用可见性补回来，否则等于没扫。
      # 公开的只有计数（缘由见扫描步 showSummary 那段注释）：哪条、哪个依赖，
      # 要看就在本机自己扫一遍。
      # 汇总与验单的逻辑在 .github/scripts/summarize-dependency-check.sh：
      # 报告要先过结构检查、份数要与根 pom 推得的应出数对账，坏了缺了逐份
      # 点名并亮 ::warning::，绝不把「判不动」说成「未发现」。
      # 这一步先确认检查脚本本身是好的（阳性对照），再看它报什么——检查脚本
      # 失灵时，解析坏掉的表现与真的没有漏洞完全一样；整套做法与理由写在
      # 脚本开头的注释里
      - name: 漏洞计数进 job summary
        if: always()
        env:
          # 扫描步骤的 continue-on-error 让 job 永远绿着；outcome 是它被豁免前的
          # 真实结果，「这次扫没扫成」要靠它判断，不能靠 job 结论
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          # 只用来判空、绝不回显：令牌缺失是「没扫成」最常见的成因，
          # 值得在运行页上单独点名，但值本身一个字节都不能落到日志里
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
          # 本次配置的数据来源一句话，与上面扫描命令里的接口地址、分析器开关同源；
          # 汇总脚本原样贴进 job summary，读的人才知道这轮看了哪些库
          SCAN_SOURCES: '漏洞数据取自 VulnCheck 的 NVD 兼容接口；Sonatype OSS Index 分析器已显式关闭（未配其凭据）'
          # 来源署名：VulnCheck 免费版要求注明数据出处，原文照贴进 job summary
          SCAN_ATTRIBUTION: '漏洞数据来自 VulnCheck（https://vulncheck.com）'
        run: |
          set -euo pipefail
          chmod +x .github/scripts/high-cvss.sh .github/scripts/no-cvssv3.sh .github/scripts/summarize-dependency-check.sh
          .github/scripts/summarize-dependency-check.sh
