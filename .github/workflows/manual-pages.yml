# 手册站发布到 GitHub Pages。
# 目前手册尚未公开发布、Pages 也未开启，因此只允许手动触发（workflow_dispatch），
# 不挂任何推送触发——挂着的话会在仓库页面留一个一直红着的失败工作流。
# 上线时再改触发方式（届时把 on 里的 push 分支加上即可）。
name: Manual site (Pages)

on:
  workflow_dispatch:

# 只有发布那一个 job 需要写 Pages 与换发令牌；生成那一个 job 只读仓库。
# 权限放在 job 级而不是顶层，生成步骤拿不到这两样。
permissions:
  contents: read

# 同一时间只跑一次发布，排队而不互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成手册站
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 生成脚本零依赖（只用 python3 标准库）。次版本固定成 3.12：
      # 写成 3.x 时，托管环境换默认解释器，同一次工作流定义两次跑到的 Python 可以不是同一条次版本。
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 生成本身带全站断链检查：有断链这一步就红，不会把缺页的站发出去
      - name: 生成
        run: python3 manual/build.py

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: manual/dist

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
